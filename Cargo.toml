[package]
name = "ai_geteway"
version = "0.1.0"
edition = "2024"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# http server + middleware
axum = "0.8"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# http client (for proxying to providers)
reqwest = { version = "0.12", features = ["json", "stream"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# error handling
thiserror = "2"
anyhow = "1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# async trait support
async-trait = "0.1"

# streaming
futures = "0.3"
async-stream = "0.3"
bytes = "1"

# request IDs
uuid = { version = "1", features = ["v4"] }

# .env file loading
dotenvy = "0.15"

# metrics (rendered via our own /metrics route, not the crate's built-in
# HTTP/push-gateway server, so those features are disabled)
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# SQLite persistence for request history (default features disabled so the
# unused Postgres/MySQL drivers aren't pulled in)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
